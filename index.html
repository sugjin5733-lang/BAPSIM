<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>밥심 (Bapsim) - 문정동 한식뷔페 일일 식단 & 실시간 팀 투표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .badge-shimmer { background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%); background-size: 200% 100%; animation: shimmer 2.5s infinite; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-24 selection:bg-orange-500 selection:text-white">

  <!-- 상단 네비게이션 바 -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div id="logoBadge" class="w-10 h-10 rounded-xl bg-orange-500 flex items-center justify-center text-white font-extrabold text-xl shadow-md shadow-orange-500/30 cursor-pointer select-none active:scale-95 transition-transform" title="5번 클릭 시 관리자 모드">
          밥
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-extrabold text-xl tracking-tight text-slate-900">밥심</h1>
            <span class="text-xs bg-orange-100 text-orange-700 font-semibold px-2 py-0.5 rounded-full">문정 법조타운</span>
            <span id="syncStatusBadge" class="text-xs bg-emerald-100 text-emerald-700 font-semibold px-2 py-0.5 rounded-full flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
              <span id="syncStatusText">Firebase 클라우드 연동됨</span>
            </span>
          </div>
          <p class="text-xs text-slate-500">매일 아침 자동 업데이트되는 한식뷔페 식단 비교 & 실시간 투표</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- 프로필 / 로그인 버튼 -->
        <button id="userProfileBtn" onclick="openAuthModal()" class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">
          <i data-lucide="user" class="w-3.5 h-3.5"></i>
          <span id="userProfileText">로그인/가입</span>
        </button>

        <!-- 관리자 모드 버튼 -->
        <button onclick="openAdminModal()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition-all">
          <i data-lucide="shield-check" class="w-3.5 h-3.5 text-orange-400"></i>
          <span>관리자</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-6xl mx-auto px-4 pt-6 space-y-6">
    <!-- 상단 요약 배너 -->
    <div class="bg-gradient-to-r from-orange-500 to-amber-500 rounded-2xl p-6 text-white shadow-lg shadow-orange-500/20 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <div class="flex items-center gap-2 text-xs font-semibold text-orange-100 mb-1">
          <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
          <span id="currentDateDisplay">오늘의 점심 식단표</span>
          <span class="bg-white/20 px-2 py-0.5 rounded-md text-[11px]">실시간 투표 진행 중</span>
        </div>
        <h2 class="text-2xl font-black tracking-tight">오늘 문정동 점심, 어디로 갈까요?</h2>
        <p class="text-xs text-orange-100 mt-1">식당별 메인 요리를 확인하고 팀원들과 투표해 보세요.</p>
      </div>
      <div class="flex gap-2 w-full md:w-auto">
        <button onclick="shareVoteRoom()" class="flex-1 md:flex-initial flex items-center justify-center gap-2 bg-white text-orange-600 font-bold px-4 py-2.5 rounded-xl text-xs hover:bg-orange-50 shadow-md transition-all active:scale-95">
          <i data-lucide="share-2" class="w-4 h-4"></i>
          투표 링크 복사
        </button>
      </div>
    </div>

    <!-- 식당 카드 리스트 그리드 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" id="restaurantCardsContainer">
      <!-- 동적 카드 렌더링 영역 -->
    </div>
  </main>

  <!-- 하단 플로팅 채팅 버튼 & 창 -->
  <div class="fixed bottom-6 right-6 z-50">
    <button id="chatToggleBtn" onclick="toggleChatWindow()" class="relative bg-orange-500 hover:bg-orange-600 text-white w-14 h-14 rounded-full shadow-xl flex items-center justify-center transition-all hover:scale-105 active:scale-95">
      <i data-lucide="message-square" class="w-6 h-6"></i>
      <span id="unreadDot" class="absolute top-1 right-1 w-3.5 h-3.5 bg-red-500 border-2 border-white rounded-full hidden"></span>
    </button>

    <!-- 채팅창 모달 -->
    <div id="chatWindow" class="hidden absolute bottom-16 right-0 w-80 sm:w-96 h-[460px] bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden">
      <div class="bg-slate-900 text-white p-3.5 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
          <span class="font-bold text-sm tracking-tight">밥심 톡 (실시간 전체 채팅)</span>
        </div>
        <button onclick="toggleChatWindow()" class="text-slate-400 hover:text-white text-xs">닫기</button>
      </div>

      <!-- 메시지 스크롤 영역 -->
      <div id="chatMessages" class="flex-1 p-3 overflow-y-auto space-y-2.5 text-xs bg-slate-50">
        <div class="text-center text-slate-400 py-4 text-[11px]">대화에 참여해보세요!</div>
      </div>

      <!-- 빠른 메시지 버튼 바 -->
      <div class="px-2.5 py-1.5 bg-slate-100 border-t border-slate-200 flex gap-1.5 overflow-x-auto text-[11px]">
        <button onclick="quickChat('🍗 오늘 닭강정 대박이네요')" class="whitespace-nowrap px-2 py-0.5 bg-white rounded-md border border-slate-200 text-slate-700 hover:bg-slate-50">🍗 닭강정 대박</button>
        <button onclick="quickChat('🏃‍♂️ 11시 40분에 로비에서 봐요!')" class="whitespace-nowrap px-2 py-0.5 bg-white rounded-md border border-slate-200 text-slate-700 hover:bg-slate-50">🏃‍♂️ 40분 로비</button>
        <button onclick="quickChat('🪑 자리 잡으러 먼저 갑니다')" class="whitespace-nowrap px-2 py-0.5 bg-white rounded-md border border-slate-200 text-slate-700 hover:bg-slate-50">🪑 자리 선점</button>
      </div>

      <!-- 입력 인풋 폼 -->
      <form onsubmit="handleSendChat(event)" class="p-2 bg-white border-t border-slate-200 flex gap-1.5">
        <input id="chatInput" type="text" placeholder="메시지를 입력하세요..." class="flex-1 bg-slate-100 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-orange-500" autocomplete="off" />
        <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white px-3 py-2 rounded-lg text-xs font-semibold">전송</button>
      </form>
    </div>
  </div>

  <!-- 회원가입/프로필 모달 -->
  <div id="authModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="font-extrabold text-slate-800 text-base">간편 프로필 설정</h3>
        <button onclick="closeAuthModal()" class="text-slate-400 hover:text-slate-600 text-xs">✕</button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="font-bold text-slate-700 block mb-1">닉네임</label>
          <input id="authNicknameInput" type="text" placeholder="예: 테라타워직장인" class="w-full border border-slate-200 rounded-lg p-2.5 text-xs focus:ring-1 focus:ring-orange-500 outline-none" />
        </div>
        <div>
          <label class="font-bold text-slate-700 block mb-1">소속 건물</label>
          <select id="authBuildingSelect" class="w-full border border-slate-200 rounded-lg p-2.5 text-xs focus:ring-1 focus:ring-orange-500 outline-none">
            <option value="테라타워 1차">문정 테라타워 1차</option>
            <option value="테라타워 2차">문정 테라타워 2차</option>
            <option value="엠스테이트">문정 엠스테이트</option>
            <option value="H비즈니스파크">문정 H비즈니스파크</option>
            <option value="SK V1 GL메트로시티">SK V1 GL메트로시티</option>
            <option value="대명벨리온">문정 대명벨리온</option>
            <option value="기타">기타 / 인근</option>
          </select>
        </div>
      </div>
      <button onclick="saveUserProfile()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-xl text-xs transition-colors">
        설정 완료 및 시작하기
      </button>
    </div>
  </div>

  <!-- 관리자 모달 -->
  <div id="adminModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl p-6 space-y-4 max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between border-b pb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="shield" class="w-5 h-5 text-orange-500"></i>
          <h3 class="font-extrabold text-slate-800 text-base">밥심 관리자 대시보드</h3>
        </div>
        <button onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-600 text-xs">✕</button>
      </div>

      <div class="flex-1 overflow-y-auto space-y-4 text-xs">
        <!-- 투표 리셋 -->
        <div class="p-4 bg-slate-50 border rounded-xl flex items-center justify-between">
          <div>
            <p class="font-bold text-slate-800">투표 현황 초기화</p>
            <p class="text-slate-500 text-[11px]">오늘 투표된 표수를 0으로 리셋합니다.</p>
          </div>
          <button onclick="resetVotes()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg font-bold">투표 초기화</button>
        </div>

        <!-- 메뉴 수동 수정 / 등록 -->
        <div class="p-4 bg-slate-50 border rounded-xl space-y-3">
          <p class="font-bold text-slate-800">오늘의 식단 수동 업데이트</p>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-600 mb-1">식당 선택</label>
              <select id="adminRestaurantSelect" class="w-full border rounded-lg p-2 bg-white">
                <option value="illu">일루퓨전 한식뷔페</option>
                <option value="mstate">엠스테이트 푸드스토리</option>
                <option value="miso">테라타워 미소한식</option>
                <option value="daon">H비즈니스 다온푸드</option>
              </select>
            </div>
            <div>
              <label class="block text-slate-600 mb-1">메인 요리 (쉼표로 구분)</label>
              <input id="adminMainMenus" type="text" placeholder="예: 유자청 닭강정, 제육볶음, 돈까스" class="w-full border rounded-lg p-2 bg-white" />
            </div>
          </div>
          <button onclick="updateRestaurantMenu()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 rounded-lg">식단 즉시 반영하기</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. Firebase 실시간 DB 초기화 (제공해주신 프로젝트 키 연결)
    const firebaseConfig = {
      apiKey: "AIzaSyDYTK4MRGsxXwZ_jzN7qlaFzrVhMVKgWxw",
      authDomain: "babsim-a3556.firebaseapp.com",
      databaseURL: "https://babsim-a3556-default-rtdb.firebaseio.com",
      projectId: "babsim-a3556",
      storageBucket: "babsim-a3556.firebasestorage.app",
      messagingSenderId: "791532866408",
      appId: "1:791532866408:web:891ef952af5e62386864dd",
      measurementId: "G-67HDKHR6WX"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 기본 식당 데이터
    let restaurants = {
      illu: { id: "illu", name: "일루퓨전 한식뷔페", building: "테라타워 2차 지하 1층", price: "9,000원", mains: ["유자청 닭강정", "생삼겹 수육", "오징어초무침"], soup: "얼큰 소고기 뭇국", votes: 0 },
      mstate: { id: "mstate", name: "엠스테이트 푸드스토리", building: "엠스테이트 지하 1층", price: "8,500원", mains: ["바삭 수제돈가스", "고추장제육", "탕수육"], soup: "진한 차돌된장찌개", votes: 0 },
      miso: { id: "miso", name: "테라타워 미소한식", building: "테라타워 1차 지하 1층", price: "8,500원", mains: ["간장 소불고기", "해물순두부", "계란말이"], soup: "맑은 황태해장국", votes: 0 },
      daon: { id: "daon", name: "H비즈니스 다온푸드", building: "H비즈니스파크 B동 B1", price: "8,000원", mains: ["춘천 닭갈비", "오리불고기", "비빔만두"], soup: "칼칼 콩나물김칫국", votes: 0 }
    };

    let currentUser = JSON.param || JSON.parse(localStorage.getItem('bapsim_user') || '{"nickname":"익명 문정러","building":"테라타워"}');
    let myVotedId = localStorage.getItem('bapsim_my_vote');

    // 2. 날짜 표시
    const now = new Date();
    const dateStr = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일`;
    document.getElementById('currentDateDisplay').textContent = dateStr;

    // 3. Firebase 실시간 리스너 (투표 & 식단)
    db.ref('restaurants').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        restaurants = data;
      } else {
        db.ref('restaurants').set(restaurants);
      }
      renderCards();
    });

    // 4. Firebase 실시간 리스너 (채팅)
    db.ref('messages').limitToLast(50).on('child_added', (snapshot) => {
      const msg = snapshot.val();
      appendChatMessage(msg);
    });

    // 5. 카드 렌더링
    function renderCards() {
      const container = document.getElementById('restaurantCardsContainer');
      container.innerHTML = '';

      let totalVotes = 0;
      let maxVote = -1;
      let topId = null;

      Object.values(restaurants).forEach(r => {
        totalVotes += (r.votes || 0);
        if ((r.votes || 0) > maxVote && (r.votes || 0) > 0) {
          maxVote = r.votes;
          topId = r.id;
        }
      });

      Object.values(restaurants).forEach(r => {
        const isVoted = myVotedId === r.id;
        const isTop = topId === r.id;
        const percent = totalVotes > 0 ? Math.round(((r.votes || 0) / totalVotes) * 100) : 0;

        const card = document.createElement('div');
        card.className = `bg-white rounded-2xl p-5 border-2 transition-all flex flex-col justify-between shadow-sm hover:shadow-md ${isVoted ? 'border-orange-500 ring-2 ring-orange-100' : 'border-slate-100'}`;

        card.innerHTML = `
          <div>
            <div class="flex items-start justify-between gap-2 mb-2">
              <div>
                <span class="text-[10px] font-bold text-orange-600 bg-orange-50 px-2 py-0.5 rounded-md">${r.building}</span>
                <h3 class="font-extrabold text-slate-900 text-base mt-1 flex items-center gap-1.5">
                  ${r.name}
                  ${isTop ? '<span class="text-xs bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold">👑 1위</span>' : ''}
                </h3>
              </div>
              <span class="text-xs font-bold text-slate-600">${r.price}</span>
            </div>

            <!-- 메인 메뉴 -->
            <div class="mt-3 space-y-1.5">
              <span class="text-[11px] font-semibold text-slate-400 block">오늘의 3대 메인</span>
              <div class="flex flex-wrap gap-1.5">
                ${r.mains.map(m => `<span class="bg-slate-100 text-slate-800 px-2 py-1 rounded-md text-xs font-bold">${m}</span>`).join('')}
              </div>
            </div>

            <!-- 국 -->
            <div class="mt-3 text-xs text-slate-600 flex items-center gap-1.5">
              <span class="text-orange-500 font-bold">국/찌개:</span>
              <span>${r.soup}</span>
            </div>
          </div>

          <!-- 투표 영역 -->
          <div class="mt-5 pt-4 border-t border-slate-100">
            <div class="flex items-center justify-between text-xs font-bold mb-1.5">
              <span class="text-slate-500">${r.votes || 0}표 (${percent}%)</span>
            </div>
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden mb-3">
              <div class="bg-orange-500 h-full rounded-full transition-all duration-500" style="width: ${percent}%"></div>
            </div>
            <button onclick="castVote('${r.id}')" class="w-full py-2.5 rounded-xl font-bold text-xs transition-all flex items-center justify-center gap-1.5 ${isVoted ? 'bg-orange-500 text-white shadow-md shadow-orange-500/30' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}">
              <i data-lucide="${isVoted ? 'check' : 'thumbs-up'}" class="w-3.5 h-3.5"></i>
              <span>${isVoted ? '투표 완료' : '이곳으로 투표'}</span>
            </button>
          </div>
        `;
        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // 6. 투표 실행
    function castVote(id) {
      if (myVotedId === id) {
        db.ref(`restaurants/${id}/votes`).transaction(v => Math.max(0, (v || 1) - 1));
        myVotedId = null;
        localStorage.removeItem('bapsim_my_vote');
      } else {
        if (myVotedId && restaurants[myVotedId]) {
          db.ref(`restaurants/${myVotedId}/votes`).transaction(v => Math.max(0, (v || 1) - 1));
        }
        db.ref(`restaurants/${id}/votes`).transaction(v => (v || 0) + 1);
        myVotedId = id;
        localStorage.setItem('bapsim_my_vote', id);

        // 채팅방 자동 알림 전송
        db.ref('messages').push({
          type: 'system',
          text: `🔔 ${currentUser.nickname}님이 [${restaurants[id].name}]에 투표하셨습니다!`,
          timestamp: Date.now()
        });
      }
    }

    // 7. 채팅 전송
    function handleSendChat(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      db.ref('messages').push({
        nickname: currentUser.nickname,
        building: currentUser.building,
        text: text,
        timestamp: Date.now()
      });

      input.value = '';
    }

    function quickChat(msg) {
      db.ref('messages').push({
        nickname: currentUser.nickname,
        building: currentUser.building,
        text: msg,
        timestamp: Date.now()
      });
    }

    function appendChatMessage(msg) {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');

      if (msg.type === 'system') {
        div.className = "text-center text-[10px] text-orange-600 bg-orange-50/80 rounded-md py-1 my-1 font-semibold";
        div.textContent = msg.text;
      } else {
        const isMe = msg.nickname === currentUser.nickname;
        div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
        div.innerHTML = `
          <span class="text-[10px] text-slate-400 mb-0.5">${msg.nickname} · ${msg.building || '문정'}</span>
          <div class="px-3 py-1.5 rounded-xl max-w-[80%] ${isMe ? 'bg-orange-500 text-white rounded-tr-none' : 'bg-white border text-slate-800 rounded-tl-none'}">
            ${msg.text}
          </div>
        `;
      }

      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    // 8. 모달 및 팝업 컨트롤
    function toggleChatWindow() {
      const w = document.getElementById('chatWindow');
      w.classList.toggle('hidden');
    }
    function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
    function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }
    function openAdminModal() { document.getElementById('adminModal').classList.remove('hidden'); }
    function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }

    function saveUserProfile() {
      const nick = document.getElementById('authNicknameInput').value.trim() || "문정러";
      const bld = document.getElementById('authBuildingSelect').value;
      currentUser = { nickname: nick, building: bld };
      localStorage.setItem('bapsim_user', JSON.stringify(currentUser));
      document.getElementById('userProfileText').textContent = `${nick} (${bld})`;
      closeAuthModal();
    }

    function resetVotes() {
      if (!confirm("전체 식당의 투표수를 0으로 초기화하시겠습니까?")) return;
      Object.keys(restaurants).forEach(k => {
        db.ref(`restaurants/${k}/votes`).set(0);
      });
      alert("투표수가 리셋되었습니다.");
    }

    function updateRestaurantMenu() {
      const id = document.getElementById('adminRestaurantSelect').value;
      const mainsRaw = document.getElementById('adminMainMenus').value.trim();
      if (!mainsRaw) return alert("메뉴를 입력해주세요.");

      const mains = mainsRaw.split(',').map(s => s.trim()).filter(Boolean);
      db.ref(`restaurants/${id}/mains`).set(mains);
      alert("오늘의 식단이 클라우드에 성공적으로 반영되었습니다!");
      closeAdminModal();
    }

    function shareVoteRoom() {
      navigator.clipboard.writeText(window.location.href);
      alert("투표 링크가 복사되었습니다! 단톡방에 공유해보세요.");
    }

    // 로고 5회 클릭 시 관리자 열기
    let clickCount = 0;
    document.getElementById('logoBadge').addEventListener('click', () => {
      clickCount++;
      if (clickCount >= 5) {
        clickCount = 0;
        openAdminModal();
      }
    });

    // 단축키 Ctrl + Shift + A
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
        e.preventDefault();
        openAdminModal();
      }
    });

    if (currentUser.nickname !== "익명 문정러") {
      document.getElementById('userProfileText').textContent = `${currentUser.nickname} (${currentUser.building})`;
    }

    lucide.createIcons();
  </script>
</body>
</html>
